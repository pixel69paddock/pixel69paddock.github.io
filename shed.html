<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>The Shed · Daily Derby</title>
<meta name="description" content="Walk the LeBron Stable in 3D. Find your stall by @handle and style your horse: coat, mane, silks, saddle and more. Free.">
<meta property="og:title" content="The Shed · Daily Derby">
<meta property="og:description" content="Your name on the plate. Your horse in the stall. Style it free.">
<meta name="theme-color" content="#1a0f09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a0f09; --panel:#24170e; --panel2:#2e1e12; --line:#4a3322; --ink:#f4ecdf; --muted:#c8b49a; --dim:#9c8670;
    --neon:#ff3d6e; --gold:#f5c242; --silver:#cfd6e3; --bronze:#d08a4e; --cyan:#3ad6ff; --night:#170f26;
    --px:"Press Start 2P", ui-monospace, monospace;
    --sans:"Space Grotesk", system-ui, -apple-system, Segoe UI, sans-serif;
    --sheet:0px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%;cursor:grab}
  #stage canvas:active{cursor:grabbing}
  .px{font-family:var(--px)}

  /* top bar */
  .top{position:fixed;left:0;right:0;top:0;z-index:7;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    background:linear-gradient(#1a0f09ee,#1a0f0900);pointer-events:none}
  .top > *{pointer-events:auto}
  .back{flex:0 0 auto;display:grid;place-items:center;width:40px;height:40px;border:2px solid #000;border-radius:6px;background:var(--panel2);color:var(--gold);text-decoration:none;font-family:var(--px);font-size:14px;box-shadow:3px 3px 0 #000}
  .sign{flex:0 0 auto;background:#1c120b;border:3px solid var(--gold);border-radius:4px;padding:8px 10px;font-family:var(--px);font-size:11px;line-height:1.3;color:var(--gold);box-shadow:3px 3px 0 #000;white-space:nowrap}
  .sign small{display:block;font-size:8px;color:var(--muted);margin-top:4px}
  .find{position:relative;flex:1 1 auto;max-width:420px;margin-left:auto}
  .find label{display:flex;align-items:center;background:#120b06;border:2px solid var(--line);border-radius:6px;padding:0 10px;height:44px;box-shadow:3px 3px 0 #000}
  .find label:focus-within{border-color:var(--cyan)}
  .find span{color:var(--dim);font-weight:700}
  .find input{flex:1;min-width:0;background:transparent;border:0;color:var(--ink);font:500 16px var(--sans);padding:0 6px;outline:none}
  .find input::placeholder{color:var(--dim)}
  .sugg{position:absolute;left:0;right:0;top:50px;background:#120b06;border:2px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.6);display:none}
  .sugg.show{display:block}
  .sugg button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;background:none;border:0;border-bottom:1px solid #2a1c12;text-align:left;cursor:pointer;font-size:15px}
  .sugg button:last-child{border-bottom:0}
  .sugg button:hover,.sugg button.act{background:#2e1e12}
  .sugg .no{margin-left:auto;font-family:var(--px);font-size:9px;color:var(--muted)}
  .sugg .miss{padding:12px;color:var(--muted);font-size:14px}
  .dot{width:10px;height:10px;border-radius:50%;border:1px solid #000;flex:0 0 auto}
  .dot.g{background:var(--gold)} .dot.s{background:var(--silver)} .dot.b{background:var(--bronze)}

  /* camera hud */
  .hud{position:fixed;z-index:4;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;align-items:flex-start;transition:bottom .25s}
  .hud .row{display:flex;flex-wrap:wrap;gap:6px}
  .hud button{background:rgba(28,18,11,.88);border:2px solid #000;border-radius:5px;color:#f4e4bc;font:600 13px var(--sans);padding:8px 11px;cursor:pointer;box-shadow:2px 2px 0 #000;min-height:38px}
  .hud button:hover{background:#3a2718}
  .hud button[aria-pressed="true"]{border-color:var(--neon);background:rgba(255,61,110,.35);color:#fff}
  .hud .nav button{font-family:var(--px);font-size:12px;min-width:44px}
  .hud .turn{display:inline-flex;gap:6px;margin-left:6px;padding-left:8px;border-left:2px solid rgba(0,0,0,.5)}
  .hud .turn button[data-turn]{font-family:var(--sans);font-size:20px;line-height:1;touch-action:none;user-select:none;-webkit-user-select:none}
  .hud .turn #faceMe{font-family:var(--sans);font-size:13px}
  .hud .turn button.held{border-color:var(--cyan);background:rgba(58,214,255,.25)}
  .hud .hint{color:#bfae93;font-size:12px;text-shadow:0 1px 2px #000}

  /* panel: right column on desktop, bottom sheet on phones */
  #panel{position:fixed;z-index:6;background:var(--panel);border:3px solid #000;box-shadow:0 0 0 2px var(--line),0 20px 60px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden}
  .ph{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;background:repeating-linear-gradient(90deg,#5c3e26 0 22px,#4a311d 22px 24px);border-bottom:3px solid #000;cursor:default}
  .ph .no{font-family:var(--px);font-size:12px;color:#fff6e0;text-shadow:2px 2px 0 #000}
  .tier{font-weight:700;font-size:12px;padding:2px 9px;border-radius:999px;border:2px solid;white-space:nowrap}
  .tier.g{color:#2a1d05;background:var(--gold);border-color:#8a6510} .tier.s{color:#2b2f3a;background:var(--silver);border-color:#7d8597} .tier.b{color:#2b1606;background:var(--bronze);border-color:#7a4a20}
  .ph .grab{margin-left:auto;background:#1c120b;border:2px solid #000;border-radius:5px;width:38px;height:32px;cursor:pointer;color:var(--gold);font-size:14px}
  .pb{overflow:auto;padding:14px 14px 18px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .who h2{font-family:var(--px);font-size:16px;line-height:1.35;color:var(--gold);margin:0 0 4px;word-break:break-word}
  .who .h{font-weight:700;font-size:17px;word-break:break-all}
  .who .meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:13px;margin-top:6px}
  .who .meta b{color:var(--ink)}
  .orig{color:var(--gold);font-weight:700}
  .sec{margin-top:16px}
  .sec h3{font:700 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between}
  .sec h3 em{font-style:normal;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:500}
  .sw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .sw button{position:relative;height:48px;border:2px solid #000;border-radius:5px;cursor:pointer;box-shadow:2px 2px 0 #000;image-rendering:pixelated;background-size:8px 8px}
  .sw button[aria-pressed="true"]{outline:3px solid var(--cyan);outline-offset:2px}
  .sw button span{position:absolute;left:0;right:0;bottom:-1px;font:600 10px var(--sans);color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;text-align:center}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .sec.deco{margin-top:22px;padding-top:14px;border-top:2px dashed var(--line)}
  .sec.deco h3{color:var(--gold);font-size:13px}
  .sw6{grid-template-columns:repeat(6,1fr);gap:6px}
  .lk::after{content:"🔒";position:absolute;top:2px;right:3px;font-size:10px;filter:drop-shadow(0 1px 1px #000)}
  .chips button.lk,.stk button.lk{position:relative}
  .chips button.lk{padding-right:22px}
  .chips button.lk::after{top:50%;transform:translateY(-50%);right:6px}
  details.more{margin-top:8px}
  details.more summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--gold);list-style:none;padding:4px 0}
  details.more summary::-webkit-details-marker{display:none}
  details.more .sw{margin-top:6px}
  .paywall{margin-top:16px;border:2px solid #8a6510;background:#2a1d08;border-radius:6px;padding:12px}
  .paywall h4{margin:0 0 6px;color:var(--gold);font-size:14px}
  .paywall p{margin:0 0 8px;font-size:12px;color:#d8c7a8}
  .paywall .pw{display:flex;flex-wrap:wrap;gap:6px}
  .paywall button{font:700 12px/1 inherit;padding:9px 10px;border-radius:4px;border:1px solid #ff3d6e;background:#ff3d6e;color:#fff;cursor:pointer}
  .paywall button.best{background:#f5c242;border-color:#f5c242;color:#2a1d05}
  .sw6 button{height:44px}
  .sw6 button span{font-size:9px}
  .sw button.pl{display:flex;align-items:center;justify-content:center;border-width:3px}
  .sw button.pl b{font-family:var(--px);font-size:12px;margin-top:-10px}
  .stk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .stk button{display:flex;flex-direction:column;align-items:center;gap:2px;background:#1c120b;border:2px solid var(--line);border-radius:6px;padding:6px 2px;cursor:pointer;color:var(--muted);font-size:11px;min-height:58px}
  .stk button img{image-rendering:pixelated;width:32px;height:32px}
  .stk button[aria-pressed="true"]{border-color:var(--cyan);background:rgba(58,214,255,.16);color:var(--ink)}
  .chips button{background:#1c120b;border:2px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:14px;color:var(--ink);min-height:38px}
  .chips button[aria-pressed="true"]{border-color:var(--cyan);background:rgba(58,214,255,.16)}
  .code{margin-top:18px;background:#120b06;border:2px dashed var(--gold);border-radius:6px;padding:12px;text-align:center}
  .code .c{font-family:var(--px);font-size:16px;color:var(--gold)}
  .code p{margin:8px 0 0;font-size:13px;color:var(--muted)}
  .code p b{color:var(--ink)}
  .acts{display:grid;gap:8px;margin-top:12px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border:2px solid #000;border-radius:6px;font:700 15px var(--sans);cursor:pointer;text-decoration:none;color:var(--ink);background:var(--panel2);box-shadow:3px 3px 0 #000;padding:8px 12px}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
  .btn-neon{background:var(--neon);color:#fff;box-shadow:3px 3px 0 #8f1438}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn.soon{background:repeating-linear-gradient(135deg,#2a1d2e 0 10px,#241828 10px 20px);border:2px dashed #7a5a8a;color:#cdb8dd;box-shadow:none;cursor:not-allowed}
  .btn.soon small{font-weight:500;color:#a993b8}
  .fine{color:var(--dim);font-size:12px;margin:10px 0 0}
  .prem h3 em.test{color:var(--gold)}
  .pi{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:8px;border:1px solid #4a3426;border-radius:6px;margin-top:6px;background:rgba(0,0,0,.18)}
  .pi .ic{font-size:22px;text-align:center}
  .pi b{display:block;font-size:14px}
  .pi small{color:var(--dim);font-size:11px}
  .pi .pa{display:flex;gap:6px}
  .pi button{font:700 12px/1 inherit;padding:8px 9px;border-radius:4px;border:1px solid #6a4a36;background:#2a1c14;color:#f4ecdf;cursor:pointer;white-space:nowrap}
  .pi button.buy{background:#ff3d6e;border-color:#ff3d6e;color:#fff}
  .pi button[aria-pressed="true"]{border-color:#f5c242;color:#f5c242}
  .pi button[disabled]{opacity:.5;cursor:not-allowed}
  .pi .own{font:700 11px/1 inherit;color:#2a1d05;background:#f5c242;padding:6px 8px;border-radius:4px}
  .pi.mine{border-color:#8a6510}
  .peek-cta{display:none;width:100%;margin-top:12px}
  .empty-st{color:var(--muted);margin:0}
  .empty-st b{color:var(--ink)}

  @media (min-width:900px){
    #panel{right:16px;top:76px;bottom:16px;width:372px;border-radius:8px}
    .ph .grab{display:none}
  }
  @media (max-width:899px){
    .top{gap:8px}
    .sign{font-size:9px;padding:7px 8px}
    .sign small{display:none}
    #panel{left:0;right:0;bottom:0;max-height:54dvh;border-radius:12px 12px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
    #panel.peek .pb .full{display:none}
    #panel.peek .peek-cta{display:flex}
    #panel.peek .pb{padding-bottom:14px}
    .ph{cursor:pointer}
    .ph::before{content:"";position:absolute;left:50%;top:4px;width:44px;height:4px;margin-left:-22px;border-radius:4px;background:#00000088}
    .hud{bottom:calc(var(--sheet) + 12px)}
    .hud .hint{display:none}
    body.sheet-open #views{display:none}
    .sw button{height:40px}
    .sec{margin-top:12px}
  }
  @media (max-width:420px){ .sign{display:none} }
  #panel[hidden]{display:none}

  #toast{position:fixed;left:50%;top:calc(74px + env(safe-area-inset-top));transform:translate(-50%,-10px);z-index:9;background:#000;color:#fff;border:2px solid var(--gold);border-radius:6px;padding:10px 14px;font-size:14px;max-width:min(92vw,460px);text-align:center;opacity:0;pointer-events:none;transition:.2s}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  .loading{position:fixed;inset:0;display:grid;place-items:center;z-index:8;background:var(--bg);font-family:var(--px);font-size:12px;color:var(--gold);transition:opacity .4s}
  .loading.done{opacity:0;pointer-events:none;visibility:hidden}

  /* reel mode: 1080x1920 film */
  body.reel{display:grid;place-items:center;background:#000}
  body.reel .top,body.reel .hud,body.reel #panel{display:none}
  #reelComp{height:100vh;width:auto;aspect-ratio:9/16;max-width:100vw;display:block;image-rendering:auto}
  .reel-ctl{position:fixed;right:16px;top:16px;display:flex;flex-direction:column;gap:8px;z-index:5;width:220px}
  .reel-ctl p{color:#bbb;font-size:12px;margin:0}
  body.clean .reel-ctl{display:none}
  /* embed: the live card on the homepage */
  body.embed .top,body.embed .hud,body.embed #panel,body.embed .loading,body.embed #toast{display:none!important}
  body.embed #stage canvas{cursor:pointer}
</style>
</head>
<body>
<div class="loading" id="loading">LOADING THE BARN…</div>
<div id="stage" aria-label="3D barn: drag to look around, scroll or pinch to zoom, tap a stall"></div>

<header class="top">
  <a class="back" href="./" title="Back to the paddock" aria-label="Back to the paddock">‹</a>
  <div class="sign" id="sign">THE LEBRON STABLE<small id="signCount">— of 10,000 stalls filled</small></div>
  <div class="find">
    <label><span>@</span><input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Find your stall" aria-label="Find a stall by Instagram handle"></label>
    <div class="sugg" id="sugg" role="listbox"></div>
  </div>
</header>

<div class="hud" id="hud">
  <div class="row nav">
    <button type="button" id="prev" aria-label="Previous stall">‹</button>
    <button type="button" id="next" aria-label="Next stall">›</button>
    <button type="button" id="mine" style="font-family:var(--sans);font-size:13px">My stall</button>
    <span class="turn" role="group" aria-label="Turn the horse">
      <button type="button" data-turn="1" aria-label="Turn the horse left (hold to keep turning)" title="Turn left · hold to spin">⟲</button>
      <button type="button" data-turn="-1" aria-label="Turn the horse right (hold to keep turning)" title="Turn right · hold to spin">⟳</button>
      <button type="button" id="faceMe" title="Turn to face you">Face me</button>
    </span>
  </div>
  <div class="row" id="views">
    <button type="button" data-v="aisle">Aisle</button>
    <button type="button" data-v="close" aria-pressed="true">Close-up</button>
    <button type="button" data-v="side">Side</button>
    <button type="button" data-v="spin">Auto-spin</button>
  </div>
  <div class="hint">Drag to look · scroll to zoom · tap a stall · ← → stalls · Q / E turn</div>
</div>

<aside id="panel" class="peek" hidden aria-live="polite">
  <div class="ph" id="ph">
    <span class="no" id="pNo">STALL #—</span><span class="tier" id="pTier"></span>
    <button class="grab" id="grab" type="button" aria-label="Show or hide the style panel">▲</button>
  </div>
  <div class="pb" id="pb"></div>
</aside>
<div id="toast" role="status"></div>

<script type="module">
  import { mount, tierOf, ACC, SADDLES, POSES, PAINTS, PLATES, STICKERS, stickerIcon, PREMIUM } from "./assets/shed3d.js?v=prem6";
  const IG = "dailyderby_horse", IGP = "https://www.instagram.com/" + IG + "/";
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const norm = h => String(h || "").trim().replace(/^@+/, "").toLowerCase();
  const validLook = c => /^[1-4]{4}$/.test(String(c || ""));
  // same fallback look as index.html, so an unclaimed horse looks the same here and in the race art
  const lookFor = h => { let x = 0; for (const c of norm(h)) x = (x * 31 + c.charCodeAt(0)) >>> 0; let o = ""; for (let i = 0; i < 4; i++) { o += (x % 4) + 1; x = Math.floor(x / 4); } return o; };
  const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 3400); };
  const P = new URLSearchParams(location.search);
  const getJSON = u => fetch(u + "?t=" + Date.now(), { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

  const [D, L] = await Promise.all([getJSON("data/derby.json"), getJSON("data/looks.json").catch(() => null)]);
  const PALX = await getJSON("data/palette.json").catch(() => null), PKEYS = ["coat", "mane", "silks", "pattern"];
  const LOOKS = L && L.parts.map((p, i) => ({ ...p, options: p.options.concat((PALX && PALX.parts[PKEYS[i]]) || []) }));
  const horses = (D.horses || []).filter(h => h.status !== "removed");
  // stall order = date followed (horses[].rank, 1 = first follower), same as the stable map on index.html
  const STALLS = horses.filter(h => h.rank).sort((a, b) => a.rank - b.rank);
  const FILLED = STALLS.length, TOTAL = (D.stable && D.stable.stalls) || 10000;
  const GOLD_N = (D.founders && D.founders.goldCount) || 800, SILVER_TO = (D.founders && D.founders.silverTo) || 5000;
  const stallOf = {}; STALLS.forEach((h, i) => stallOf[norm(h.handle)] = i + 1);
  // first claimer of each look code (✦ Original)
  const OWNER = {};
  if (D.originals) Object.entries(D.originals).forEach(([c, h]) => { if (validLook(c)) OWNER[c] = norm(h); });
  else horses.forEach(h => { if (validLook(h.look) && !OWNER[h.look]) OWNER[h.look] = norm(h.handle); });
  const stName = D.stable && D.stable.name ? String(D.stable.name).toUpperCase().replace(/^THE\s+/, "").replace(/\s+STABLES?$/, "") : "LEBRON";
  $("#sign").firstChild.textContent = `THE ${stName} STABLE`;
  $("#signCount").textContent = `${FILLED.toLocaleString()} of ${TOTAL.toLocaleString()} stalls filled`;

  // drafts: looks tried on this device, per handle (preview only; the claim is the comment)
  // premium (paid) items: who owns what comes from the shop server (the payment is the proof, no comment needed);
  // try-ons are this device only
  const SHOP = D.shop || {};
  let SAPI = (SHOP.api || "").replace(/\/$/, "") || null;
  if (P.get("shopapi") && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) SAPI = P.get("shopapi");
  let OWN = {}, STOCK = {}, TRY = {}, OFF = {}, STYLES = {};
  const GRAND = SHOP.grandfathered || {};   // stall extras saved before 25 Nov stay free for these horses
  const PARTS = ["unlock-saddle", "unlock-acc", "unlock-paint", "unlock-plate", "unlock-stickers"];
  function ownSet(h) { const o = new Set(ownedOf(h).map(x => x.id)); if (o.has("unlock-all")) PARTS.forEach(i => o.add(i)); return o; }
  function needsOf(st, h) {
    const g = shedDecode(GRAND[norm(h)]), out = [];
    if (st.idx.some(n => n > 4)) out.push("palette");
    if (![0, 1].includes(st.saddle) && !(g && g.saddle === st.saddle)) out.push("unlock-saddle");
    if (st.acc.some(a => !(g && g.acc.includes(a)))) out.push("unlock-acc");
    if (st.wall && !(g && g.wall === st.wall)) out.push("unlock-paint");
    if (st.plate && !(g && g.plate === st.plate)) out.push("unlock-plate");
    if (st.stickers.some(t => !(g && g.stickers.includes(t)))) out.push("unlock-stickers");
    return out;
  }

        <div class="h">@${esc(h.handle)} ${h.original ? `<span class="orig" title="First to claim this look">✦ Original</span>` : ""}</div>
        <div class="meta"><span><b>${h.races || 0}</b> races</span><span><b>${medals}</b> medal${medals === 1 ? "" : "s"}</span>${h.joined ? `<span>since <b>${new Date(h.joined + "T12:00").toLocaleDateString(undefined, { day: "numeric", month: "short" })}</b></span>` : ""}${mine ? `<span style="color:var(--cyan);font-weight:700">● your stall</span>` : ""}</div>
        <button class="btn btn-neon peek-cta" type="button" id="styleIt">🎨 Style this horse · free</button>
      </div>
      <div class="full">
        <div class="sec"><h3>Pose <em>${esc(POSES.find(x => x.id === api.poseOf(k)).name)}</em></h3><div class="chips" id="pose">${POSES.map(x => `<button type="button" data-p="${x.id}" aria-pressed="${api.poseOf(k) === x.id}">${esc(x.name)}</button>`).join("")}</div></div>
        <div class="sec"><h3>Coat <em>${esc(LOOKS[0].options[st.idx[0] - 1].name)}</em></h3>${swatches(0, st.idx[0], h)}</div>
        <div class="sec"><h3>Mane &amp; tail <em>${esc(LOOKS[1].options[st.idx[1] - 1].name)}</em></h3>${swatches(1, st.idx[1], h)}</div>
        <div class="sec"><h3>Silks <em>${esc(LOOKS[2].options[st.idx[2] - 1].name)}</em></h3>${swatches(2, st.idx[2], h)}</div>
        <div class="sec"><h3>Pattern <em>${esc(LOOKS[3].options[st.idx[3] - 1].name)}</em></h3>${swatches(3, st.idx[3], h)}</div>
        <div class="sec"><h3>Saddle <em>${esc(SADDLES[st.saddle])}</em></h3><div class="chips" id="sad">${SADDLES.map((s, i) => `<button type="button" class="${lk(h, "saddle", i)}" data-s="${i}" aria-pressed="${st.saddle === i}">${esc(s)}</button>`).join("")}</div></div>
        <div class="sec"><h3>Accessories</h3><div class="chips" id="acc">${ACC.map(a => `<button type="button" class="${lk(h, "acc", a.id)}" data-a="${a.id}" aria-pressed="${st.acc.includes(a.id)}">${esc(a.name)}</button>`).join("")}</div></div>
        ${passSec(h)}
        ${premiumSec(h)}
        <div class="sec deco"><h3>Your stall <em>${GRAND[norm(h.handle)] ? "early-bird extras kept free" : "🔒 extras from US$2"}</em></h3></div>
        <div class="sec"><h3>Wall paint <em>${esc(PAINTS[st.wall].name)}</em></h3><div class="sw sw6">${PAINTS.map((p, i) => `<button type="button" class="${lk(h, "wall", i)}" data-wall="${i}" aria-pressed="${st.wall === i}" style="background:${p.base ? `repeating-linear-gradient(90deg,${p.base} 0 10px,rgba(0,0,0,.25) 10px 11px)` : "repeating-linear-gradient(90deg,#7a5434 0 10px,#4b3020 10px 11px)"}" aria-label="Wall paint: ${esc(p.name)}"><span>${esc(p.name)}</span></button>`).join("")}</div></div>
        <div class="sec"><h3>Nameplate <em>${esc(PLATES[st.plate].name)}</em></h3><div class="sw">${PLATES.map((p, i) => `<button type="button" data-plate="${i}" aria-pressed="${st.plate === i}" class="pl ${lk(h, "plate", i)}" style="background:${p.in};border-color:${p.bg};color:${p.ink}" aria-label="Nameplate: ${esc(p.name)}"><b>@</b><span style="color:${p.ink};text-shadow:none">${esc(p.name)}</span></button>`).join("")}</div></div>
        <div class="sec"><h3>Stickers <em>${st.stickers.length}/8</em></h3><div class="stk">${STICKERS.map(t => `<button type="button" class="${lk(h, "sticker", t.id)}" data-st="${t.id}" aria-pressed="${st.stickers.includes(t.id)}" title="${esc(t.name)}"><img src="${STICON[t.id]}" alt="" width="32" height="32"><span>${esc(t.name)}</span></button>`).join("")}</div></div>
        ${miss.length ? paywall(h, miss) : keyHere && (st.paid || own.size) ? `<div class="code"><div class="c">SAVE · NO COMMENT</div><p>${edited ? "<b>Not saved yet.</b> " : ""}This device can save @${esc(h.handle)}'s horse straight away.</p></div>` : `<div class="code"><div class="c">HORSE ${code}+${shedEncode(st)}</div><p>${statusLine(code, h)}</p>
          <p>${edited ? `<b>Not saved yet.</b> Save it and everyone sees your stall within about an hour.` : st.saved ? `This is the stall everyone sees.` : `Save it so everyone sees your horse and stall like this.`}</p></div>`}
        <div class="acts">
          ${miss.length ? "" : keyHere && (st.paid || own.size) ? `<button class="btn btn-neon" type="button" id="saveKey"${edited ? "" : " disabled style='opacity:.5'"}>Save my horse · no comment needed</button>` : `<button class="btn btn-neon" type="button" id="claim">Save my stall · free</button>`}
          <div class="btn-row"><button class="btn" type="button" id="rand">🎲 Surprise me</button><button class="btn" type="button" id="reset"${edited ? "" : " disabled style='opacity:.5'"}>Reset</button></div>
          ${mine ? "" : `<button class="btn" type="button" id="isme">This is me: set as my stall</button>`}
        </div>
        <p class="fine">The first 4 colours of each part, a Leather saddle, natural walls and the classic plate are free. More colours and extras unlock with a pass, saved straight away with no comment. Saving free choices = comment the code on the latest reel from your own account (that's how we know it's you); the first to claim a look gets ✦ Original. Custom horses run +5–10% faster, and anyone can customise. Premium extras are looks only: they never change speed or results. <a href="terms.html" style="color:inherit">Terms</a></p>
      </div>`;
    pb.querySelectorAll(".sw button").forEach(b => b.onclick = () => {
      if (!b.dataset.part) return; const c = st.idx.slice(); c[+b.dataset.part] = +b.dataset.i; setDraft(h, { idx: c });
    });
    pb.querySelectorAll("#pose button").forEach(b => b.onclick = () => { api.pose(cur, b.dataset.p); render(); });
    pb.querySelectorAll("[data-wall]").forEach(b => b.onclick = () => setDraft(h, { wall: +b.dataset.wall }));
    pb.querySelectorAll("[data-plate]").forEach(b => b.onclick = () => setDraft(h, { plate: +b.dataset.plate }));
    pb.querySelectorAll("[data-st]").forEach(b => b.onclick = () => { const x = new Set(st.stickers); x.has(b.dataset.st) ? x.delete(b.dataset.st) : x.add(b.dataset.st); setDraft(h, { stickers: [...x] }); });
    pb.querySelectorAll("#sad button").forEach(b => b.onclick = () => setDraft(h, { saddle: +b.dataset.s }));
    pb.querySelectorAll("#acc button").forEach(b => b.onclick = () => {
      const s = new Set(st.acc); s.has(b.dataset.a) ? s.delete(b.dataset.a) : s.add(b.dataset.a); setDraft(h, { acc: [...s] });
    });
    $("#rand").onclick = () => setDraft(h, {
      idx: Array.from({ length: 4 }, () => 1 + Math.floor(Math.random() * 4)),
      saddle: Math.floor(Math.random() * 4), acc: ACC.filter(() => Math.random() < 0.35).map(a => a.id)
    });
    $("#reset").onclick = () => { delete DRAFT[norm(h.handle)]; store.set("dd-shed", DRAFT); api.refresh(cur, true); render(); };
    if ($("#saveKey")) $("#saveKey").onclick = () => saveStyleNow(h, k);
    if ($("#claim")) $("#claim").onclick = async () => {
      const msg = `HORSE ${code}+${shedEncode(st)}${h.name ? " " + h.name : ""}`;
      let ok = false; try { await navigator.clipboard.writeText(msg); ok = true; } catch {}
      toast(ok ? `Copied “${msg}”. Paste it as a comment on the latest reel.` : `Comment “${msg}” on the latest reel.`);
      setTimeout(() => window.open(D.latestReel || IGP, "_blank", "noopener"), 900);
    };
    const im = $("#isme"); if (im) im.onclick = () => { ME = norm(h.handle); store.set("dd-stall-h", ME); try { localStorage.setItem("dd-stall", ME); } catch {} render(); toast(`Stall #${k.toLocaleString()} saved as yours on this device.`); };
    pb.querySelectorAll("[data-try]").forEach(b => b.onclick = () => {
      const key = norm(h.handle), id = b.dataset.try;
      TRY[key] = TRY[key] === id ? null : id; api.refresh(k, true); render();
    });
    pb.querySelectorAll("[data-buy]").forEach(b => b.onclick = () => buy(b, h, k, b.dataset.buy));
    pb.querySelectorAll("[data-wear]").forEach(b => b.onclick = async () => {
      const key = norm(h.handle), id = b.dataset.wear, cur0 = OFF[key] || [];
      const off = cur0.includes(id) ? cur0.filter(x => x !== id) : [...cur0, id];
      b.disabled = true;
      try {
        const j = await fetch(SAPI + "/equip", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ handle: key, key: KEYS[key], off }) }).then(r => r.json());
        if (j.ok) { OFF[key] = j.off; api.refresh(k, true); render(); toast(off.includes(id) ? "Taken off. Put it back on any time." : "Wearing it again."); }
        else toast(j.error || "Couldn't save that.");
      } catch { toast("Couldn't reach the shop."); }
      b.disabled = false;
    });
    pb.scrollTop = keep;
    $("#styleIt").onclick = e => { e.stopPropagation(); openSheet(true); };
    layoutInset();
  }
  const money = c => "US$" + (c / 100).toFixed(c % 100 ? 2 : 0);
  const PASS_IDS = ["unlock-all", "palette", ...PARTS];
  function passSec(h) {
    const drops = PASS_IDS.map(id => (SHOP.drops || []).find(d => d.id === id && d.status !== "hidden")).filter(Boolean);
    if (!drops.length) return "";
    const o = ownSet(h.handle);
    return `<div class="sec prem"><h3>Unlock passes <em>for @${esc(h.handle)}</em></h3>${drops.map(d => `<div class="pi${o.has(d.id) ? " mine" : ""}"><div class="ic">${d.id === "unlock-all" ? "🗝️" : d.id === "palette" ? "🎨" : "🔓"}</div><div><b>${esc(d.name)}</b><small>${esc(d.blurb || "")} · ${money(d.price)}</small></div><div class="pa">${o.has(d.id) ? `<span class="own">Unlocked</span>` : `<button type="button" class="buy" data-buy="${d.id}" ${SAPI ? "" : "disabled"}>Buy</button>`}</div></div>`).join("")}</div>`;
  }
  const NEED_NAME = { palette: "Palette pass", "unlock-saddle": "Saddles", "unlock-acc": "Accessories", "unlock-paint": "Wall paint", "unlock-plate": "Nameplates", "unlock-stickers": "Stickers" };
  function paywall(h, miss) {
    const price = id => { const d = (SHOP.drops || []).find(x => x.id === id); return d ? money(d.price) : ""; };
    const stall = miss.filter(m => m !== "palette");
    return `<div class="paywall"><h4>🔒 Unlock to save this look</h4><p>Trying on is free. To save it on @${esc(h.handle)}'s horse, unlock what you picked. It's saved straight away, no comment needed.</p><div class="pw">
      ${miss.map(m => `<button type="button" data-buy="${m}">${NEED_NAME[m]} · ${price(m)}</button>`).join("")}
      ${stall.length > 1 ? `<button type="button" class="best" data-buy="unlock-all">Everything pass · ${price("unlock-all")}</button>` : ""}
    </div><p style="margin:8px 0 0">Or press Reset to go back to the free options.</p></div>`;
  }
  async function saveStyleNow(h, k, quiet) {
    const key = norm(h.handle), st = stateOf(k);
    if (!ownedOf(h.handle).length) { toast("@" + h.handle + " has no paid items yet."); return; }
    try {
      const j = await fetch(SAPI + "/style", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ handle: key, key: KEYS[key], style: { idx: st.idx, saddle: st.saddle, acc: st.acc, wall: st.wall, plate: st.plate, stickers: st.stickers, name: st.name } }) }).then(r => r.json());
      if (j.ok) { STYLES[key] = j.style; delete DRAFT[key]; store.set("dd-shed", DRAFT); api.refresh(k, true); render(); if (!quiet) toast("Saved! Everyone sees your horse like this now."); }
      else toast(j.error || "Couldn't save.");
    } catch { toast("Couldn't reach the shop."); }
  }
  function premiumSec(h) {
    const drops = (SHOP.drops || []).filter(d => PREM[d.id] && d.status !== "hidden");
    if (!drops.length) return "";
    const owned = ownedOf(h.handle), t = TRY[norm(h.handle)];
    const test = SHOP.testMode && SHOW_TEST;
    return `<div class="sec prem"><h3>Premium extras <em class="${test ? "test" : ""}">${test ? "test mode: card 4242 4242 4242 4242" : "limited · looks only"}</em></h3>
      ${drops.map(d => {
        const p = PREM[d.id], o = owned.find(x => x.id === d.id), sk = STOCK[d.id], left = sk ? sk.left : d.limit;
        const out = d.status === "closed" || left <= 0;
        return `<div class="pi${o ? " mine" : ""}"><div class="ic">${p.icon}</div>
          <div><b>${esc(d.name)}</b><small>${p.kind === "coat" ? "Coat" : p.kind === "stall" ? "Stall" : "Effect"} · ${out ? "sold out" : `${left} of ${d.limit} left`} · ${money(d.price)}</small></div>
          <div class="pa">${o ? (true ? `<button type="button" data-wear="${d.id}" aria-pressed="${!(OFF[norm(h.handle)] || []).includes(d.id)}">${(OFF[norm(h.handle)] || []).includes(d.id) ? "Put on" : "Wearing ✓"}</button><span class="own">#${o.n}</span>` : `<span class="own">Owned #${o.n}</span>`)
            : `<button type="button" data-try="${d.id}" aria-pressed="${t === d.id}">${t === d.id ? "Take off" : "Try on"}</button><button type="button" class="buy" data-buy="${d.id}" ${SAPI && !out ? "" : "disabled"}>${out ? "Sold out" : SAPI ? "Buy" : "Soon"}</button>`}</div></div>`;
      }).join("")}
      <p class="fine" style="margin-top:8px">Try anything on for free. Buy it and it's saved on @${esc(h.handle)}'s horse straight away, numbered, no comment needed. Apple Pay, Google Pay or card; prices in US$, paid in your own currency.</p></div>`;
  }
  async function loadShop() {
    if (!SAPI) return;
    try {
      const j = await fetch(SAPI + "/shop", { cache: "no-store" }).then(r => r.json());
      OWN = j.skins || {}; OFF = j.off || {}; STYLES = j.styles || {};
      STOCK = Object.fromEntries((j.drops || []).map(d => [d.id, d]));
      if (api.refreshAll) api.refreshAll();
      render();
    } catch {}
  }
  async function buy(btn, h, k, id) {
    const label = btn.textContent; btn.disabled = true; btn.textContent = "…";
    try {
      const r = await fetch(SAPI + "/checkout", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ kind: "skin", id, handle: norm(h.handle), ret: "shed", stall: k }) });
      const j = await r.json();
      if (j.url) { location.href = j.url; return; }
      toast(j.error || "Couldn't open checkout. Try again.");
    } catch { toast("Couldn't reach the shop. Try again."); }
    btn.disabled = false; btn.textContent = label;
  }
  async function afterPay(id) {
    history.replaceState(null, "", location.pathname + "?stall=" + cur);
    toast("Payment received. Unlocking…");
    for (let i = 0; i < 12; i++) {
      try {
        const o = await fetch(SAPI + "/order?session=" + encodeURIComponent(id), { cache: "no-store" }).then(r => r.json());
        if (o.status === "paid") { if (o.key && o.handle) { KEYS[o.handle] = o.key; store.set("dd-keys", KEYS); } TRY = {}; await loadShop(); if (draftOf(o.handle)) await saveStyleNow(STALLS[stallOf[o.handle] - 1], stallOf[o.handle], true); openSheet(true); toast(`🎉 ${o.name} #${o.n} of ${o.limit} is saved on @${o.handle}'s horse.`); return; }
        if (o.status === "refunded") { toast(`${o.name} sold out just before your payment, so you've been refunded in full.`); return; }
      } catch {}
      await new Promise(r => setTimeout(r, 2000));
    }
    toast("Payment received. It can take a minute to show; Stripe has emailed your receipt.");
  }
  function setDraft(h, part) {
    const key = norm(h.handle), base = stateOf(stallOf[key]);
    DRAFT[key] = { idx: base.idx, saddle: base.saddle, acc: base.acc, wall: base.wall, plate: base.plate, stickers: base.stickers, ...DRAFT[key], ...part };
    delete DRAFT[key].look;
    store.set("dd-shed", DRAFT);
    api.refresh(stallOf[key], true); render();
  }
  // demand gauge for paid extras: counts taps, no payments. Sent to the claims server once it has an /interest route.
  function logPremium(h, k) {
    const log = store.get("dd-premium", { taps: 0, first: null });
    log.taps++; log.first = log.first || new Date().toISOString(); log.last = new Date().toISOString(); store.set("dd-premium", log);
    const ev = { ev: "premium_tap", stall: k, handle: norm(h.handle), at: log.last, taps: log.taps };
    console.info("[shed] premium interest", ev);
    const url = D.interestApi || (D.claimsApi ? D.claimsApi.replace(/\/$/, "") + "/interest" : null);
    if (url && navigator.sendBeacon) navigator.sendBeacon(url, JSON.stringify(ev));
    toast("Premium extras aren't open yet. Thanks: your tap was counted, so we know you'd want them.");
  }

  if (EMBED) {
    // homepage card: a slow tour. The next free stall ("NEXT: YOU?"), a random horse, your own stall if we know it.
    // prefer stalls people really decorated (saved shed codes); otherwise any filled stall
    const decorated = STALLS.map((h, i) => h.shed ? i + 1 : 0).filter(Boolean);
    const mineK = stallOf[ME], picks = () => decorated.length && Math.random() < 0.75 ? decorated[Math.floor(Math.random() * decorated.length)] : 1 + Math.floor(Math.random() * FILLED);
    const tour = [() => [FILLED + 1, "aisle"], () => [picks(), "side"], () => [mineK || picks(), "close"], () => [FILLED + 1, "aisle"], () => [picks(), "close"]];
    let i = 0;
    setInterval(() => { if (document.hidden) return; i = (i + 1) % tour.length; const [k, v] = tour[i](); cur = k; api.focus(k, { view: v }); }, 5200);
    return;
  }
  render();
  loadShop().then(() => { if (P.get("paid")) afterPay(P.get("paid")); });
  document.querySelectorAll("#views button").forEach(x => x.setAttribute("aria-pressed", x.dataset.v === api.viewName));
  openSheet(wide.matches || P.get("sheet") === "1");
  if (startH && !stallOf[startH]) toast(`No stall for @${startH} yet. Follow @${IG} to get one.`);
  }
</script>
</body>
</html>
